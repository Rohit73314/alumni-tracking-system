<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Graduation Cap -->
  <g transform="translate(50, 50)">
    <!-- Cap top -->
    <polygon points="-25,-8 0,-18 25,-8 0,2" fill="white"/>
    
    <!-- Cap base -->
    <rect x="-20" y="-8" width="40" height="8" rx="1" fill="white" opacity="0.9"/>
    
    <!-- Tassel -->
    <line x1="25" y1="-8" x2="30" y2="5" stroke="white" stroke-width="1.5"/>
    <circle cx="30" cy="8" r="3" fill="white"/>
    
    <!-- Letter 'G' -->
    <text x="-8" y="20" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">G</text>
  </g>
  
  <!-- Network dots (representing alumni network) -->
  <circle cx="20" cy="75" r="3" fill="white" opacity="0.7"/>
  <circle cx="35" cy="78" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="65" cy="78" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="80" cy="75" r="3" fill="white" opacity="0.7"/>
  
  <!-- Connecting lines -->
  <line x1="20" y1="75" x2="35" y2="78" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="35" y1="78" x2="50" y2="60" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="60" x2="65" y2="78" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="65" y1="78" x2="80" y2="75" stroke="white" stroke-width="1" opacity="0.4"/>
</svg>
